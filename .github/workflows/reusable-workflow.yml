name: Testing - Reusable Workflow

on:
  workflow_call:
    inputs:
      ingress-url:
        description: Provide the Ingress URL
        required: true
        type: string

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          URL: ${{ inputs.ingress-url }}
        run: |
          set -e
          curl -s -k "https://$URL/live" | jq -r .status | grep -i live